name: Request central release ledger policy

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: request-release-ledger-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-policy:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: this base-owned script never loads or executes candidate code.
      - name: Request validation from the central publisher
        env:
          DISPATCH_TOKEN: ${{ secrets.PINEDATEC_CI_DISPATCH_TOKEN }}
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          repository = "PinedaTec-EU/LeonardoMD"
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          pr = event.get("pull_request", {})
          eligible = (
              event.get("action") in {"opened", "ready_for_review", "synchronize", "reopened", "edited"}
              and os.environ.get("GITHUB_EVENT_NAME") == "pull_request_target"
              and os.environ.get("GITHUB_REPOSITORY") == repository
              and pr.get("draft") is False
              and pr.get("state") == "open"
              and pr.get("head", {}).get("repo", {}).get("full_name") == repository
              and pr.get("base", {}).get("repo", {}).get("full_name") == repository
              and pr.get("base", {}).get("ref") == "main"
          )
          if not eligible:
              print("Event does not require central policy validation.")
              sys.exit(0)
          token = os.environ.get("DISPATCH_TOKEN", "")
          if not token:
              sys.exit("PINEDATEC_CI_DISPATCH_TOKEN is required.")
          payload = {
              "event_type": "private-release-ledger",
              "client_payload": {
                  "target_repository": repository,
                  "operation": "validate",
                  "pilot_request_id": f"leonardo-pr{int(pr['number'])}-run{int(os.environ['GITHUB_RUN_ID'])}",
              },
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/PinedaTec-EU/pinedatec-ci/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      sys.exit(f"Dispatch failed with HTTP {response.status}.")
          except urllib.error.HTTPError as error:
              sys.exit(f"Dispatch failed with HTTP {error.code}.")
          except urllib.error.URLError:
              sys.exit("Dispatch failed due to a network error.")
          print("Central validation requested; wait for the App release-ledger-policy check.")
          PYTHON
