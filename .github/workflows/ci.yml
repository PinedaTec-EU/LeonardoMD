name: macOS MVP
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify selected toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: Test packaging version metadata
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test Leonardo agent plugin
        run: python3 -m unittest discover -s plugins/leonardo-format/tests -v
      - name: Verify pinned Sparkle artifact cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prime-sparkle-cache.py
      - name: Mark Swift test crash collection window
        run: python3 -c 'import os, pathlib, time; pathlib.Path(os.environ["RUNNER_TEMP"], "swift-test-started-at.txt").write_text(str(time.time()))'
      - name: Isolate recurring FileList test
        id: isolated-file-list
        continue-on-error: true
        shell: bash
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LEONARDO_VISUAL_EVIDENCE: ${{ github.workspace }}/visual-evidence
        run: |
          set +e
          swift test --filter 'FileListTests.testColorDefaultsRoundTripAndInheritance' 2>&1 | tee "$RUNNER_TEMP/swift-test-isolated.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Fq "testColorDefaultsRoundTripAndInheritance" "$RUNNER_TEMP/swift-test-isolated.log"; then
            echo 'executed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executed=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Build and test
        id: full-suite
        if: steps.isolated-file-list.outcome == 'success' && steps.isolated-file-list.outputs.executed == 'true'
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LEONARDO_VISUAL_EVIDENCE: ${{ github.workspace }}/visual-evidence
        run: swift test
      - name: Summarize Swift test crash reports
        if: always()
        run: |
          started_after="$(cat "$RUNNER_TEMP/swift-test-started-at.txt" 2>/dev/null || echo 0)"
          report_directory="$(python3 -c 'from pathlib import Path; print(Path.home() / "Library/Logs/DiagnosticReports")')"
          python3 scripts/summarize_swift_test_crashes.py \
            --report-directory "$report_directory" \
            --started-after "$started_after" \
            --output "$RUNNER_TEMP/swift-test-diagnostics/summary.txt"
      - name: Upload sanitized Swift test crash summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-crash-summary-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/swift-test-diagnostics/summary.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce Swift test results
        if: always()
        env:
          ISOLATED_OUTCOME: ${{ steps.isolated-file-list.outcome }}
          ISOLATED_EXECUTED: ${{ steps.isolated-file-list.outputs.executed }}
          FULL_SUITE_OUTCOME: ${{ steps.full-suite.outcome }}
        run: |
          if [[ "$ISOLATED_OUTCOME" != "success" || "$ISOLATED_EXECUTED" != "true" || "$FULL_SUITE_OUTCOME" != "success" ]]; then
            echo "::error::The isolated FileList case and full Swift test suite must both pass."
            exit 1
          fi
      - name: Build iOS companion
        run: xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "generic/platform=iOS Simulator" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Test Little Leonardo revocation recheck
        run: xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "platform=iOS Simulator,name=iPhone 17 Pro" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO -only-testing:LittleLeonardoTests/MobileRevocationTests/testOnDemandForbiddenResponseRechecksStatusBeforeRecordingRevocation test
      - name: Test Little Leonardo diagnostic log
        run: xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "platform=iOS Simulator,name=iPhone 17 Pro" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO -only-testing:LittleLeonardoTests/MobileDiagnosticLogTests test
      - name: Validate update metadata
        run: python3 -m unittest discover -s Tests/Packaging
      - name: Record preview capture provenance
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Head: %s\nSurface: native WKWebView Markdown preview\nViewport: 1000x800 points\nStates: light, dark; first tag focused\nFixture: synthetic tagged document\n' "$EVIDENCE_SHA" > visual-evidence/provenance.txt
          printf 'Head: %s\nSurface: native NSHostingView Preferences - Updates\nViewports: full 580x620; component 532x550 points\nLanguages: en, es\nStates: stable, beta, waiting, busy, deferred, development, startup-error\nFixture: synthetic session and isolated update driver\nLimits: component rendering; native glass tab bar pixels unavailable; no hosted install/relaunch or fresh packaged startup claim\n' "$EVIDENCE_SHA" > visual-evidence/updates/provenance.txt
      - name: Record release notes capture provenance
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Head: %s\nSurface: native NSHostingView Release Notes\nViewport: 760x580 points\nLanguages: en, es\nStates: light, dark; interval and downgrade; suppression on\nFixture: synthetic 18-PR history\nLimits: component rendering; no fresh packaged-process startup claim\n' "$EVIDENCE_SHA" > visual-evidence/release-notes/provenance.txt
      - name: Upload preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: preview-tags-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/
          if-no-files-found: error
      - name: Package app
        run: ./scripts/build-app.sh
      - name: Verify packaged release changes
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/qa-bundle.py output/LeonardoMD.app --verify-only --report release-notes-package.json
      - name: Upload package inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-notes-package.json
          if-no-files-found: error
