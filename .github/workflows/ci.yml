name: macOS MVP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # Validate PR branches once and run post-merge validation on main pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.select.outputs.macos }}
      ios: ${{ steps.select.outputs.ios }}
      package: ${{ steps.select.outputs.package }}
      plugin: ${{ steps.select.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: /scripts/ci_plan.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Select validation suites
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_plan.py

  macos-tests:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify selected toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: Verify pinned Sparkle artifact cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prime-sparkle-cache.py
      - name: Mark Swift test crash collection window
        run: python3 -c 'import os, pathlib, time; pathlib.Path(os.environ["RUNNER_TEMP"], "swift-test-started-at.txt").write_text(str(time.time()))'
      - name: Isolate recurring FileList suite
        id: isolated-file-list
        continue-on-error: true
        shell: bash
        run: |
          set +e
          swift test --filter 'FileListTests' 2>&1 | tee "$RUNNER_TEMP/swift-test-isolated.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Fq "FileListTests" "$RUNNER_TEMP/swift-test-isolated.log"; then
            echo 'executed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executed=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Isolate interrupted TLS diagnostic test
        id: isolated-truncated-https
        continue-on-error: true
        shell: bash
        run: |
          set +e
          swift test --filter 'HTTPSRuntimeTests.testInterruptedPinnedTLSBodyReportsBoundedPartialTransferContext' 2>&1 | tee "$RUNNER_TEMP/swift-test-truncated-https.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Fq "testInterruptedPinnedTLSBodyReportsBoundedPartialTransferContext" "$RUNNER_TEMP/swift-test-truncated-https.log"; then
            echo 'executed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executed=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Isolate project download diagnostics test
        id: isolated-project-https
        continue-on-error: true
        shell: bash
        run: |
          set +e
          swift test --filter 'HTTPSRuntimeTests.testProjectDownloadReportsSizeAndReadFailuresOverPinnedHTTPS' 2>&1 | tee "$RUNNER_TEMP/swift-test-project-https.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Fq "testProjectDownloadReportsSizeAndReadFailuresOverPinnedHTTPS" "$RUNNER_TEMP/swift-test-project-https.log"; then
            echo 'executed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executed=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Build and test
        id: full-suite
        timeout-minutes: 20
        shell: bash
        # The isolated steps must pass before their cases can be excluded here.
        if: steps.isolated-file-list.outcome == 'success' && steps.isolated-file-list.outputs.executed == 'true' && steps.isolated-truncated-https.outcome == 'success' && steps.isolated-truncated-https.outputs.executed == 'true' && steps.isolated-project-https.outcome == 'success' && steps.isolated-project-https.outputs.executed == 'true'
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/swift-test-diagnostics"
          python3 scripts/run-swift-test-with-timeout.py --seconds 900 \
            --diagnostics "$RUNNER_TEMP/swift-test-diagnostics" \
            --skip 'LeonardoAppTests[.]FileListTests/' \
            --skip 'LeonardoSyncTransportTests[.]HTTPSRuntimeTests/testInterruptedPinnedTLSBodyReportsBoundedPartialTransferContext$' \
            --skip 'LeonardoSyncTransportTests[.]HTTPSRuntimeTests/testProjectDownloadReportsSizeAndReadFailuresOverPinnedHTTPS$' 2>&1 \
            | tee "$RUNNER_TEMP/swift-test-diagnostics/full-suite.log"
      - name: Summarize Swift test crash reports
        if: always()
        run: |
          started_after="$(cat "$RUNNER_TEMP/swift-test-started-at.txt" 2>/dev/null || echo 0)"
          report_directory="$(python3 -c 'from pathlib import Path; print(Path.home() / "Library/Logs/DiagnosticReports")')"
          python3 scripts/summarize_swift_test_crashes.py \
            --report-directory "$report_directory" \
            --started-after "$started_after" \
            --output "$RUNNER_TEMP/swift-test-diagnostics/summary.txt"
      - name: Upload sanitized Swift test crash summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-crash-summary-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/swift-test-diagnostics/summary.txt
          if-no-files-found: error
          retention-days: 3
      - name: Upload unsuccessful Swift suite diagnostics
        if: always() && (steps.full-suite.outcome == 'failure' || steps.full-suite.outcome == 'cancelled')
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/swift-test-diagnostics/full-suite.log
            ${{ runner.temp }}/swift-test-diagnostics/timeout-processes.txt
            ${{ runner.temp }}/swift-test-diagnostics/timeout-stack-*.txt
          if-no-files-found: warn
          retention-days: 3
      - name: Enforce Swift test results
        if: always()
        env:
          ISOLATED_OUTCOME: ${{ steps.isolated-file-list.outcome }}
          ISOLATED_EXECUTED: ${{ steps.isolated-file-list.outputs.executed }}
          TRUNCATED_HTTPS_OUTCOME: ${{ steps.isolated-truncated-https.outcome }}
          TRUNCATED_HTTPS_EXECUTED: ${{ steps.isolated-truncated-https.outputs.executed }}
          PROJECT_HTTPS_OUTCOME: ${{ steps.isolated-project-https.outcome }}
          PROJECT_HTTPS_EXECUTED: ${{ steps.isolated-project-https.outputs.executed }}
          FULL_SUITE_OUTCOME: ${{ steps.full-suite.outcome }}
        run: |
          if [[ "$ISOLATED_OUTCOME" != "success" || "$ISOLATED_EXECUTED" != "true" || "$TRUNCATED_HTTPS_OUTCOME" != "success" || "$TRUNCATED_HTTPS_EXECUTED" != "true" || "$PROJECT_HTTPS_OUTCOME" != "success" || "$PROJECT_HTTPS_EXECUTED" != "true" || "$FULL_SUITE_OUTCOME" != "success" ]]; then
            echo "::error::The isolated FileList suite, both isolated HTTPS regressions, and the full Swift test suite must pass."
            exit 1
          fi

  ios-tests:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Start Little Leonardo simulator boot
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import re
          import sys

          data = json.load(sys.stdin)
          matches = [
              (runtime, device)
              for runtime, devices in data["devices"].items()
              for device in devices
              if device.get("name") == "iPhone 17 Pro" and device.get("isAvailable", True)
          ]
          matches.sort(
              key=lambda item: tuple(int(part) for part in re.findall(r"\d+", item[0])),
              reverse=True,
          )
          if not matches:
              raise SystemExit("no available iPhone 17 Pro simulator")
          selected = matches[0][1]
          print(selected["udid"], selected["state"])
          ')"
          read -r device_id state <<< "$device"
          # simctl boot starts the OS without waiting for readiness.
          case "$state" in
            Booted|Booting) ;;
            *) xcrun simctl boot "$device_id" ;;
          esac
          printf 'LITTLE_LEONARDO_SIMULATOR_ID=%s\n' "$device_id" >> "$GITHUB_ENV"
      - name: Build iOS companion
        run: xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "generic/platform=iOS Simulator" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Wait for Little Leonardo simulator readiness
        timeout-minutes: 10
        run: xcrun simctl bootstatus "$LITTLE_LEONARDO_SIMULATOR_ID"
      - name: Test Little Leonardo read-only document rendering
        run: >-
          xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "platform=iOS Simulator,id=$LITTLE_LEONARDO_SIMULATOR_ID" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO
          -parallel-testing-enabled NO
          -only-testing:LittleLeonardoTests/MobileReaderSpacingTests/testLeonardoDocumentsRenderReadOnlyInLittleLeonardo
          test-without-building
      - name: Test Little Leonardo unit suites
        run: >-
          xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "platform=iOS Simulator,id=$LITTLE_LEONARDO_SIMULATOR_ID" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO
          -parallel-testing-enabled NO
          -only-testing:LittleLeonardoTests/MobileRevocationTests
          -only-testing:LittleLeonardoTests/MobileDiagnosticLogTests
          -only-testing:LittleLeonardoTests/MobileDemoStoreTests
          -only-testing:LittleLeonardoTests/MobileDirectConnectionStoreTests
          -only-testing:LittleLeonardoTests/MobileConnectionDisplayNameTests
          -only-testing:LittleLeonardoTests/MobileProjectFileVisibilityTests
          -only-testing:LittleLeonardoTests/MobileReaderSpacingTests
          -skip-testing:LittleLeonardoTests/MobileReaderSpacingTests/testLeonardoDocumentsRenderReadOnlyInLittleLeonardo
          test-without-building

  package:
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test packaging version metadata
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate update metadata
        run: python3 -m unittest discover -s Tests/Packaging
      - name: Verify pinned Sparkle artifact cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prime-sparkle-cache.py
      - name: Package app
        run: ./scripts/build-app.sh
      - name: Verify packaged release changes
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/qa-bundle.py output/LeonardoMD.app --verify-only --report release-notes-package.json
      - name: Upload package inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-notes-package.json
          if-no-files-found: error

  plugin-tests:
    needs: plan
    if: needs.plan.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test Leonardo agent plugin
        run: python3 -m unittest discover -s plugins/leonardo-format/tests -v

  test:
    if: ${{ always() }}
    needs: [plan, macos-tests, ios-tests, package, plugin-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require the planned validation results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MACOS_SELECTED: ${{ needs.plan.outputs.macos }}
          IOS_SELECTED: ${{ needs.plan.outputs.ios }}
          PACKAGE_SELECTED: ${{ needs.plan.outputs.package }}
          PLUGIN_SELECTED: ${{ needs.plan.outputs.plugin }}
          MACOS_RESULT: ${{ needs.macos-tests.result }}
          IOS_RESULT: ${{ needs.ios-tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PLUGIN_RESULT: ${{ needs.plugin-tests.result }}
        shell: bash
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::CI planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          failed=0
          require_result() {
            case "$2:$3" in
              true:success|false:skipped) return ;;
            esac
            echo "::error::$1 selected=$2 result=$3"
            failed=1
          }
          require_result macOS "$MACOS_SELECTED" "$MACOS_RESULT"
          require_result iOS "$IOS_SELECTED" "$IOS_RESULT"
          require_result package "$PACKAGE_SELECTED" "$PACKAGE_RESULT"
          require_result plugin "$PLUGIN_SELECTED" "$PLUGIN_RESULT"
          exit "$failed"
