name: macOS MVP
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify selected toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: Test packaging version metadata
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test Leonardo agent plugin
        run: python3 -m unittest discover -s plugins/leonardo-format/tests -v
      - name: Build and test
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LEONARDO_VISUAL_EVIDENCE: ${{ github.workspace }}/visual-evidence
        run: swift test
      - name: Build iOS companion
        run: xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "generic/platform=iOS Simulator" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO build
      - name: Validate update metadata
        run: python3 -m unittest discover -s Tests/Packaging
      - name: Record preview capture provenance
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Head: %s\nSurface: native WKWebView Markdown preview\nViewport: 1000x800 points\nStates: light, dark; first tag focused\nFixture: synthetic tagged document\n' "$EVIDENCE_SHA" > visual-evidence/provenance.txt
          printf 'Head: %s\nSurface: native NSHostingView Preferences - Updates\nViewports: full 580x620; component 532x550 points\nLanguages: en, es\nStates: stable, beta, waiting, busy, deferred, development, startup-error\nFixture: synthetic session and isolated update driver\nLimits: component rendering; native glass tab bar pixels unavailable; no hosted install/relaunch or fresh packaged startup claim\n' "$EVIDENCE_SHA" > visual-evidence/updates/provenance.txt
      - name: Record release notes capture provenance
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Head: %s\nSurface: native NSHostingView Release Notes\nViewport: 760x580 points\nLanguages: en, es\nStates: light, dark; interval and downgrade; suppression on\nFixture: synthetic 18-PR history\nLimits: component rendering; no fresh packaged-process startup claim\n' "$EVIDENCE_SHA" > visual-evidence/release-notes/provenance.txt
      - name: Upload preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: preview-tags-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/
          if-no-files-found: error
      - name: Package app
        run: ./scripts/build-app.sh
      - name: Verify packaged release changes
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/qa-bundle.py output/LeonardoMD.app --verify-only --report release-notes-package.json
      - name: Upload package inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-notes-package.json
          if-no-files-found: error
