name: macOS MVP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # Validate PR branches once and run post-merge validation on main pushes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.select.outputs.macos }}
      ios: ${{ steps.select.outputs.ios }}
      package: ${{ steps.select.outputs.package }}
      plugin: ${{ steps.select.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: /scripts/ci_plan.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Select validation suites
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_plan.py

  macos-tests:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify selected toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: Verify pinned Sparkle artifact cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prime-sparkle-cache.py
      - name: Mark Swift test crash collection window
        run: python3 -c 'import os, pathlib, time; pathlib.Path(os.environ["RUNNER_TEMP"], "swift-test-started-at.txt").write_text(str(time.time()))'
      - name: Isolate recurring FileList suite
        id: isolated-file-list
        continue-on-error: true
        shell: bash
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LEONARDO_VISUAL_EVIDENCE: ${{ github.workspace }}/visual-evidence
        run: |
          set +e
          swift test --filter 'FileListTests' 2>&1 | tee "$RUNNER_TEMP/swift-test-isolated.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Fq "FileListTests" "$RUNNER_TEMP/swift-test-isolated.log"; then
            echo 'executed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executed=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Isolate interrupted TLS diagnostic test
        id: isolated-truncated-https
        continue-on-error: true
        shell: bash
        run: |
          set +e
          swift test --filter 'HTTPSRuntimeTests.testInterruptedPinnedTLSBodyReportsBoundedPartialTransferContext' 2>&1 | tee "$RUNNER_TEMP/swift-test-truncated-https.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Fq "testInterruptedPinnedTLSBodyReportsBoundedPartialTransferContext" "$RUNNER_TEMP/swift-test-truncated-https.log"; then
            echo 'executed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executed=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Isolate project download diagnostics test
        id: isolated-project-https
        continue-on-error: true
        shell: bash
        run: |
          set +e
          swift test --filter 'HTTPSRuntimeTests.testProjectDownloadReportsSizeAndReadFailuresOverPinnedHTTPS' 2>&1 | tee "$RUNNER_TEMP/swift-test-project-https.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Fq "testProjectDownloadReportsSizeAndReadFailuresOverPinnedHTTPS" "$RUNNER_TEMP/swift-test-project-https.log"; then
            echo 'executed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executed=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Build and test
        id: full-suite
        timeout-minutes: 20
        shell: bash
        if: steps.isolated-file-list.outcome == 'success' && steps.isolated-file-list.outputs.executed == 'true' && steps.isolated-truncated-https.outcome == 'success' && steps.isolated-truncated-https.outputs.executed == 'true' && steps.isolated-project-https.outcome == 'success' && steps.isolated-project-https.outputs.executed == 'true'
        env:
          NSUnbufferedIO: "YES"
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LEONARDO_VISUAL_EVIDENCE: ${{ github.workspace }}/visual-evidence
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/swift-test-diagnostics"
          python3 scripts/run-swift-test-with-timeout.py --seconds 900 \
            --diagnostics "$RUNNER_TEMP/swift-test-diagnostics" 2>&1 \
            | tee "$RUNNER_TEMP/swift-test-diagnostics/full-suite.log"
      - name: Summarize Swift test crash reports
        if: always()
        run: |
          started_after="$(cat "$RUNNER_TEMP/swift-test-started-at.txt" 2>/dev/null || echo 0)"
          report_directory="$(python3 -c 'from pathlib import Path; print(Path.home() / "Library/Logs/DiagnosticReports")')"
          python3 scripts/summarize_swift_test_crashes.py \
            --report-directory "$report_directory" \
            --started-after "$started_after" \
            --output "$RUNNER_TEMP/swift-test-diagnostics/summary.txt"
      - name: Upload sanitized Swift test crash summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-crash-summary-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/swift-test-diagnostics/summary.txt
          if-no-files-found: error
          retention-days: 3
      - name: Upload unsuccessful Swift suite diagnostics
        if: always() && (steps.full-suite.outcome == 'failure' || steps.full-suite.outcome == 'cancelled')
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/swift-test-diagnostics/full-suite.log
            ${{ runner.temp }}/swift-test-diagnostics/timeout-processes.txt
            ${{ runner.temp }}/swift-test-diagnostics/timeout-stack-*.txt
          if-no-files-found: warn
          retention-days: 3
      - name: Enforce Swift test results
        if: always()
        env:
          ISOLATED_OUTCOME: ${{ steps.isolated-file-list.outcome }}
          ISOLATED_EXECUTED: ${{ steps.isolated-file-list.outputs.executed }}
          TRUNCATED_HTTPS_OUTCOME: ${{ steps.isolated-truncated-https.outcome }}
          TRUNCATED_HTTPS_EXECUTED: ${{ steps.isolated-truncated-https.outputs.executed }}
          PROJECT_HTTPS_OUTCOME: ${{ steps.isolated-project-https.outcome }}
          PROJECT_HTTPS_EXECUTED: ${{ steps.isolated-project-https.outputs.executed }}
          FULL_SUITE_OUTCOME: ${{ steps.full-suite.outcome }}
        run: |
          if [[ "$ISOLATED_OUTCOME" != "success" || "$ISOLATED_EXECUTED" != "true" || "$TRUNCATED_HTTPS_OUTCOME" != "success" || "$TRUNCATED_HTTPS_EXECUTED" != "true" || "$PROJECT_HTTPS_OUTCOME" != "success" || "$PROJECT_HTTPS_EXECUTED" != "true" || "$FULL_SUITE_OUTCOME" != "success" ]]; then
            echo "::error::The isolated FileList suite, both isolated HTTPS regressions, and the full Swift test suite must pass."
            exit 1
          fi
      - name: Capture native guided signing screens
        if: steps.full-suite.outcome == 'success'
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LEONARDO_GUIDED_SIGNING_CAPTURE: ${{ runner.temp }}/guided-signing-evidence
        run: |
          swift test --skip-build --filter GuidedSigningCaptureTests/testCaptureMacSigningComponents
          for screen in mac-al-abrir mac-documento-con-firmas mac-formulario-renderizado mac-lienzo-rubrica mac-espera-rubrica-enlazada; do
            test -s "$LEONARDO_GUIDED_SIGNING_CAPTURE/$screen.png"
            test -s "$LEONARDO_GUIDED_SIGNING_CAPTURE/$screen.context.json"
          done
      - name: Upload native guided signing captures
        if: steps.full-suite.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: guided-signing-native-captures-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/guided-signing-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Capture native synchronization error dialogs
        id: sync-error-captures
        if: steps.full-suite.outcome == 'success'
        continue-on-error: true
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LEONARDO_SYNC_ERROR_EVIDENCE: ${{ runner.temp }}/sync-error-evidence
        run: |
          mkdir -p "$LEONARDO_SYNC_ERROR_EVIDENCE"
          capture_status=0
          swift test --skip-build --filter PeerSyncErrorMessageTests.testCaptureProductionAccessDeniedAlert || capture_status=1
          swift test --skip-build --filter PeerSyncErrorMessageTests.testCaptureProductionDownloadAlert || capture_status=1
          python3 - "$LEONARDO_SYNC_ERROR_EVIDENCE" "$EVIDENCE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          source = sys.argv[2]
          images = (
              "access-denied-en.png",
              "access-denied-es.png",
              "download-error-en.png",
              "download-error-es.png",
          )
          for name in images:
              image = root / name
              context = image.with_suffix(".context.json")
              if not image.is_file() or image.stat().st_size == 0:
                  raise SystemExit(f"Missing native capture: {name}")
              state = json.loads(context.read_text(encoding="utf-8"))["state"]
              if source not in state:
                  raise SystemExit(f"Capture source does not match this run: {name}")
          PY
          test "$capture_status" -eq 0
      - name: Upload native synchronization error captures
        id: upload-sync-error-captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-error-native-captures-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/sync-error-evidence/
          if-no-files-found: warn
          retention-days: 3
      - name: Require complete native synchronization captures
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.sync-error-captures.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload-sync-error-captures.outcome }}
        run: |
          if [[ "$CAPTURE_OUTCOME" != "success" || "$ARTIFACT_OUTCOME" != "success" ]]; then
            echo "::error::Native synchronization dialog captures and their evidence artifact must succeed."
            exit 1
          fi
      - name: Capture Preview synchronization alerts
        id: preview-alert-captures
        if: always() && steps.full-suite.outcome == 'success'
        continue-on-error: true
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LEONARDO_PREVIEW_ALERT_EVIDENCE: ${{ runner.temp }}/preview-alert-evidence
        run: |
          mkdir -p "$LEONARDO_PREVIEW_ALERT_EVIDENCE"
          swift test --skip-build --filter SessionEditingTests/testCapturePreviewSynchronizationWarningsInBothLanguages
          python3 - "$LEONARDO_PREVIEW_ALERT_EVIDENCE" "$EVIDENCE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          source = sys.argv[2]
          for locale in ("en", "es"):
              for state in ("retry", "close"):
                  name = f"preview-alert-{locale}-{state}.png"
                  image = root / name
                  context = root / f"{name}.context.json"
                  if not image.is_file() or image.stat().st_size == 0:
                      raise SystemExit(f"Missing native Preview capture: {name}")
                  if json.loads(context.read_text(encoding="utf-8"))["source_revision"] != source:
                      raise SystemExit(f"Preview capture source does not match this run: {name}")
          PY
      - name: Upload Preview synchronization alert captures
        id: upload-preview-alert-captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-alert-native-captures-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/preview-alert-evidence/
          if-no-files-found: warn
          retention-days: 3
      - name: Record preview capture provenance
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Head: %s\nSurface: native WKWebView Markdown preview\nViewport: 1000x800 points\nStates: light, dark; first tag focused\nFixture: synthetic tagged document\n' "$EVIDENCE_SHA" > visual-evidence/provenance.txt
          printf 'Head: %s\nSurface: native NSHostingView Preferences - Updates\nViewports: full 580x620; component 532x550 points\nLanguages: en, es\nStates: stable, beta, waiting, busy, deferred, development, startup-error\nFixture: synthetic session and isolated update driver\nLimits: component rendering; native glass tab bar pixels unavailable; no hosted install/relaunch or fresh packaged startup claim\n' "$EVIDENCE_SHA" > visual-evidence/updates/provenance.txt
      - name: Record release notes capture provenance
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Head: %s\nSurface: native NSHostingView Release Notes\nViewport: 760x580 points\nLanguages: en, es\nStates: light, dark; interval and downgrade; suppression on\nFixture: synthetic 18-PR history\nLimits: component rendering; no fresh packaged-process startup claim\n' "$EVIDENCE_SHA" > visual-evidence/release-notes/provenance.txt
      - name: Upload preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: preview-tags-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/
          if-no-files-found: error

  ios-tests:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build iOS companion
        run: xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "generic/platform=iOS Simulator" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Select Little Leonardo simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import re
          import sys

          data = json.load(sys.stdin)
          matches = [
              (runtime, device)
              for runtime, devices in data["devices"].items()
              for device in devices
              if device.get("name") == "iPhone 17 Pro" and device.get("isAvailable", True)
          ]
          matches.sort(
              key=lambda item: tuple(int(part) for part in re.findall(r"\d+", item[0])),
              reverse=True,
          )
          if not matches:
              raise SystemExit("no available iPhone 17 Pro simulator")
          print(matches[0][1]["udid"])
          ')"
          printf 'LITTLE_LEONARDO_SIMULATOR_ID=%s\n' "$device_id" >> "$GITHUB_ENV"
      - name: Test Little Leonardo read-only document rendering
        run: >-
          xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "platform=iOS Simulator,id=$LITTLE_LEONARDO_SIMULATOR_ID" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO
          -parallel-testing-enabled NO
          -only-testing:LittleLeonardoTests/MobileReaderSpacingTests/testLeonardoDocumentsRenderReadOnlyInLittleLeonardo
          test-without-building
      - name: Seed legacy recovery archive for UI coverage
        shell: bash
        run: |
          set -euo pipefail
          fixture="doc/validation/git-retirement/fixtures/59521A0B-559C-4477-BE42-39AC03349CC3.json"
          expected_sha="083ebf51c0153131ce6b97f8d66ab4b6026a3623152b9f397fa0461ee761a62c"
          actual_sha="$(shasum -a 256 "$fixture" | awk '{ print $1 }')"
          test "$actual_sha" = "$expected_sha"
          device_id="$LITTLE_LEONARDO_SIMULATOR_ID"
          simulator_state() {
            xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          target = sys.argv[1]
          matches = [
              device
              for devices in json.load(sys.stdin)["devices"].values()
              for device in devices
              if device["udid"] == target
          ]
          if len(matches) != 1:
              raise SystemExit(f"selected simulator {target} is unavailable")
          print(matches[0]["state"])
          ' "$device_id"
          }
          device_state="$(simulator_state)"
          # XCTest can return while CoreSimulator is still shutting down.
          for _ in {1..30}; do
            if [ "$device_state" != "Shutting Down" ]; then
              break
            fi
            sleep 2
            device_state="$(simulator_state)"
          done
          case "$device_state" in
            Booted|Booting) ;;
            Shutdown) xcrun simctl boot "$device_id" ;;
            *) echo "Unexpected state for selected simulator $device_id: $device_state" >&2; exit 1 ;;
          esac
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" .build/little-ios/Build/Products/Debug-iphonesimulator/LittleLeonardo.app
          app_data="$(xcrun simctl get_app_container "$device_id" eu.pinedatec.LittleLeonardo data)"
          corpus="$app_data/Library/Application Support/LittleLeonardo/Corpus"
          mkdir -p "$corpus"
          install -m 600 "$fixture" "$corpus/59521A0B-559C-4477-BE42-39AC03349CC3.json"
          test "$(shasum -a 256 "$corpus/59521A0B-559C-4477-BE42-39AC03349CC3.json" | awk '{ print $1 }')" = "$expected_sha"
      - name: Test Little Leonardo unit suites and recovery UI
        run: >-
          xcodebuild -project Mobile/LittleLeonardo.xcodeproj -scheme LittleLeonardo -destination "platform=iOS Simulator,id=$LITTLE_LEONARDO_SIMULATOR_ID" -derivedDataPath .build/little-ios CODE_SIGNING_ALLOWED=NO
          -parallel-testing-enabled NO
          -only-testing:LittleLeonardoTests/MobileRevocationTests
          -only-testing:LittleLeonardoTests/MobileDiagnosticLogTests
          -only-testing:LittleLeonardoTests/MobileConnectionDisplayNameTests
          -only-testing:LittleLeonardoTests/MobileProjectFileVisibilityTests
          -only-testing:LittleLeonardoTests/MobileReaderSpacingTests
          -skip-testing:LittleLeonardoTests/MobileReaderSpacingTests/testLeonardoDocumentsRenderReadOnlyInLittleLeonardo
          -only-testing:LittleLeonardoUITests/PairingUITests/testLegacyRecoveryIsReadableAndExportableWithoutEditingOrSending
          -only-testing:LittleLeonardoUITests/PairingUITests/testLegacyRecoveryCopyIsLocalizedInEnglish
          -only-testing:LittleLeonardoUITests/PairingUITests/testLegacyRecoveryCopyIsLocalizedInSpanish
          test-without-building

  package:
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test packaging version metadata
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate update metadata
        run: python3 -m unittest discover -s Tests/Packaging
      - name: Verify pinned Sparkle artifact cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prime-sparkle-cache.py
      - name: Package app
        run: ./scripts/build-app.sh
      - name: Verify packaged release changes
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/qa-bundle.py output/LeonardoMD.app --verify-only --report release-notes-package.json
      - name: Upload package inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-notes-package.json
          if-no-files-found: error

  plugin-tests:
    needs: plan
    if: needs.plan.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test Leonardo agent plugin
        run: python3 -m unittest discover -s plugins/leonardo-format/tests -v

  test:
    if: ${{ always() }}
    needs: [plan, macos-tests, ios-tests, package, plugin-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require the planned validation results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MACOS_SELECTED: ${{ needs.plan.outputs.macos }}
          IOS_SELECTED: ${{ needs.plan.outputs.ios }}
          PACKAGE_SELECTED: ${{ needs.plan.outputs.package }}
          PLUGIN_SELECTED: ${{ needs.plan.outputs.plugin }}
          MACOS_RESULT: ${{ needs.macos-tests.result }}
          IOS_RESULT: ${{ needs.ios-tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PLUGIN_RESULT: ${{ needs.plugin-tests.result }}
        shell: bash
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::CI planning did not succeed ($PLAN_RESULT)"
            exit 1
          fi
          failed=0
          require_result() {
            case "$2:$3" in
              true:success|false:skipped) return ;;
            esac
            echo "::error::$1 selected=$2 result=$3"
            failed=1
          }
          require_result macOS "$MACOS_SELECTED" "$MACOS_RESULT"
          require_result iOS "$IOS_SELECTED" "$IOS_RESULT"
          require_result package "$PACKAGE_SELECTED" "$PACKAGE_RESULT"
          require_result plugin "$PLUGIN_SELECTED" "$PLUGIN_RESULT"
          exit "$failed"
