<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leonardo calendar renderer validation</title>
<link rel="stylesheet" href="../../../Sources/LeonardoRender/Resources/leonardo-forms.css">
<style>
:root { --ld-background: #ede0bc; --ld-text: #171710; --ld-accent: #8f3824; }
:root.dark { --ld-background: #20242b; --ld-text: #eee9df; --ld-accent: #e5ac71; }
* { box-sizing: border-box; }
body { margin: 32px; background: var(--ld-background); color: var(--ld-text); font: 20px system-ui; }
main { max-width: 680px; }
</style>
<main id="root"></main>
<script src="../../../Sources/LeonardoRender/Resources/leonardo-calendar.js"></script>
<script src="../../../Sources/LeonardoRender/Resources/leonardo-forms.js"></script>
<script>
if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.classList.add('dark');
const root = document.querySelector('main');
LeonardoForms.begin({allowsFormFilling:true,source:'validation',leonardo:{document:{locale:'es'}}},root);
const row = document.createElement('p'); row.className = 'leonardo-form-row'; root.append(row);
row.append(LeonardoForms.field('review',{type:'date',label:'Fecha de revisión'},'2026-10-17'));
const next = document.createElement('p'); root.append(next);
next.append(LeonardoForms.field('review',{type:'date',label:'Fecha repetida'},'2026-10-17'));
root.querySelector('.leonardo-calendar-toggle').click();
</script></html>
